<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">NEO autonomous research loop</title>
  <desc id="desc">NEO repeatedly measured pi, read failures, formed one hypothesis, edited only pi, ran quality gates, and kept or reverted each change. After reaching a plateau, it froze the prompt and ran the sealed holdout once.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081220"/>
      <stop offset="1" stop-color="#131d32"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#67e8f9"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".3"/>
    </filter>
  </defs>
  <rect width="1440" height="900" rx="36" fill="url(#bg)"/>
  <text x="720" y="92" text-anchor="middle" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="46" font-weight="760">One brief, then an autonomous research loop</text>
  <text x="720" y="136" text-anchor="middle" fill="#9fb0c8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="23">NEO selected each next step from benchmark evidence</text>

  <g fill="none" stroke="#67e8f9" stroke-width="4" marker-end="url(#arrow)" opacity=".9">
    <path d="M 390 284 C 475 211, 560 193, 635 201"/>
    <path d="M 805 201 C 900 205, 986 240, 1045 300"/>
    <path d="M 1115 405 C 1117 493, 1088 559, 1018 614"/>
    <path d="M 897 679 C 809 722, 672 726, 575 694"/>
    <path d="M 420 619 C 343 568, 313 498, 320 410"/>
  </g>

  <g filter="url(#shadow)" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <g transform="translate(180 250)">
      <rect width="290" height="155" rx="26" fill="#14233a" stroke="#36506f"/>
      <circle cx="48" cy="46" r="24" fill="#223b57"/>
      <text x="48" y="54" text-anchor="middle" fill="#67e8f9" font-size="24" font-weight="800">1</text>
      <text x="86" y="52" fill="#f1f5f9" font-size="28" font-weight="720">Measure</text>
      <text x="32" y="98" fill="#a9b8cc" font-size="19">Run all 60 development</text>
      <text x="32" y="126" fill="#a9b8cc" font-size="19">tasks with the current pi</text>
    </g>

    <g transform="translate(575 168)">
      <rect width="290" height="155" rx="26" fill="#14233a" stroke="#36506f"/>
      <circle cx="48" cy="46" r="24" fill="#223b57"/>
      <text x="48" y="54" text-anchor="middle" fill="#67e8f9" font-size="24" font-weight="800">2</text>
      <text x="86" y="52" fill="#f1f5f9" font-size="28" font-weight="720">Diagnose</text>
      <text x="32" y="98" fill="#a9b8cc" font-size="19">Read trajectories and grader</text>
      <text x="32" y="126" fill="#a9b8cc" font-size="19">output; group root causes</text>
    </g>

    <g transform="translate(970 280)">
      <rect width="290" height="155" rx="26" fill="#14233a" stroke="#36506f"/>
      <circle cx="48" cy="46" r="24" fill="#223b57"/>
      <text x="48" y="54" text-anchor="middle" fill="#67e8f9" font-size="24" font-weight="800">3</text>
      <text x="86" y="52" fill="#f1f5f9" font-size="28" font-weight="720">Hypothesize</text>
      <text x="32" y="98" fill="#a9b8cc" font-size="19">Choose one general cause</text>
      <text x="32" y="126" fill="#a9b8cc" font-size="19">and one behavioral change</text>
    </g>

    <g transform="translate(855 585)">
      <rect width="325" height="155" rx="26" fill="#14233a" stroke="#36506f"/>
      <circle cx="48" cy="46" r="24" fill="#223b57"/>
      <text x="48" y="54" text-anchor="middle" fill="#67e8f9" font-size="24" font-weight="800">4</text>
      <text x="86" y="52" fill="#f1f5f9" font-size="28" font-weight="720">Edit only pi</text>
      <text x="32" y="98" fill="#a9b8cc" font-size="19">Change the system prompt,</text>
      <text x="32" y="126" fill="#a9b8cc" font-size="19">not tasks or model weights</text>
    </g>

    <g transform="translate(260 585)">
      <rect width="355" height="155" rx="26" fill="#14233a" stroke="#36506f"/>
      <circle cx="48" cy="46" r="24" fill="#223b57"/>
      <text x="48" y="54" text-anchor="middle" fill="#67e8f9" font-size="24" font-weight="800">5</text>
      <text x="86" y="52" fill="#f1f5f9" font-size="28" font-weight="720">Gate and decide</text>
      <text x="32" y="98" fill="#a9b8cc" font-size="19">Check, test, build, rerun,</text>
      <text x="32" y="126" fill="#a9b8cc" font-size="19">then keep or revert</text>
    </g>
  </g>

  <g transform="translate(525 378)" filter="url(#shadow)">
    <circle cx="195" cy="120" r="142" fill="#0c182b" stroke="url(#accent)" stroke-width="5"/>
    <circle cx="195" cy="120" r="112" fill="#101f34" stroke="#2d4665"/>
    <text x="195" y="101" text-anchor="middle" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="56" font-weight="850" letter-spacing="4">NEO</text>
    <text x="195" y="140" text-anchor="middle" fill="#67e8f9" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="21" font-weight="700">AUTONOMOUS</text>
    <text x="195" y="170" text-anchor="middle" fill="#9fb0c8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="19">research operator</text>
  </g>

  <g transform="translate(166 797)">
    <rect width="1108" height="64" rx="20" fill="#0d1a2c" stroke="#2e4663"/>
    <text x="36" y="40" fill="#9fb0c8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="21">PLATEAU</text>
    <path d="M 160 32 L 244 32" stroke="#67e8f9" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="275" y="40" fill="#f1f5f9" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700">Freeze H3</text>
    <path d="M 418 32 L 502 32" stroke="#67e8f9" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="535" y="40" fill="#f1f5f9" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700">Run sealed holdout once</text>
    <text x="890" y="40" fill="#5eead4" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="800">19/20 · 95%</text>
  </g>
</svg>
